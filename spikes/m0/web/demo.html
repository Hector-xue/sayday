<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日日说 · 跟读测评</title>
<style>
  :root {
    --bg: #faf8f4; --surface: #ffffff; --ink: #1d1c1a; --muted: #77736b; --line: #e7e2d8;
    --accent: #2f4fa8; --good: #2e8b57; --warn: #c48a12; --bad: #c2412d;
    --good-bg: #e7f3ec; --warn-bg: #fbf1dc; --bad-bg: #f9e4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --surface: #1f1f1c; --ink: #ecebe6; --muted: #9b978d; --line: #33322d;
      --accent: #8aa4ee; --good: #6cc495; --warn: #e2b54f; --bad: #ef7f6a;
      --good-bg: #1c3226; --warn-bg: #3a2f14; --bad-bg: #3d211b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 28px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .target { font: 500 22px/1.4 Georgia, "Times New Roman", serif; margin: 18px 0 6px; }
  .phon { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .rec { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 14px; cursor: pointer; flex: none; }
  .rec.on { background: var(--bad); animation: pulse 1.2s ease-in-out infinite; }
  .rec:disabled { opacity: .4; cursor: default; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--bad) 18%, transparent); } }
  .ghost { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; white-space: nowrap; flex: none; }
  .status { color: var(--muted); font-size: 13px; }
  .score { font: 600 44px/1 Georgia, serif; }
  .words { display: flex; flex-wrap: wrap; gap: 14px 18px; margin-top: 16px; }
  .w { display: flex; flex-direction: column; gap: 4px; }
  .w b { font: 500 18px Georgia, serif; }
  .ps { display: flex; gap: 3px; }
  .p { font-size: 11px; padding: 1px 5px; border-radius: 5px; }
  .g { background: var(--good-bg); color: var(--good); }
  .y { background: var(--warn-bg); color: var(--warn); }
  .r { background: var(--bad-bg); color: var(--bad); }
  .tail { font-size: 11px; color: var(--warn); }
  .tips { margin: 14px 0 0; padding-left: 18px; color: var(--ink); }
  .meta { font: 12px/1.7 ui-monospace, Menlo, monospace; color: var(--muted); word-break: break-all; white-space: pre-wrap; }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); color: var(--ink); font: inherit; resize: vertical; }
  @media (prefers-reduced-motion: reduce) { .rec.on { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>跟读测评</h1>
  <p class="sub">日日说 · M0 技术验证 · 全部在本机计算，录音不上传</p>

  <section class="card">
    <div class="chips" id="chips"></div>
    <div class="target" id="target"></div>
    <div class="phon" id="phon"></div>
    <details style="margin-top:12px"><summary class="status">自定义句子</summary>
      <textarea id="custom" rows="2" placeholder="输入一句英文"></textarea>
      <button class="ghost" id="useCustom" style="margin-top:8px">用这句</button>
    </details>
    <div class="row">
      <button class="rec" id="rec" disabled>录音</button>
      <button class="ghost" id="listen">听示范</button>
      <span class="status" id="status">正在载入模型…</span>
    </div>
  </section>

  <section class="card" id="result" hidden>
    <div class="score" id="score"></div>
    <div class="status">本句发音分（按中国学习者人工评分校准，含尾音检查）</div>
    <div class="words" id="words"></div>
    <ul class="tips" id="tips"></ul>
  </section>

  <section class="card"><div class="meta" id="meta"></div><p class="status" style="margin:12px 0 0"><a href="./index.html" style="color:var(--accent)">设备测速</a> · 截图本区域发回即可</p></section>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
