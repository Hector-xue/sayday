# 剧集配音：content/episodes/*.json 的台词 → Kokoro（每个角色自己的声音）→ mp3。美音 / 英音各一个任务，几分钟
# 服务器用 ONLY=e scripts/sync-audio.sh <run_id> 发布到 sayday.ivyea.com/audio/{us,gb}/e/
name: content-episodes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/episodes/**']

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        accent: [us, gb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: npm ci
        working-directory: content/audio
        run: npm ci --no-audit --no-fund
      - name: Kokoro 模型缓存
        uses: actions/cache@v4
        with:
          path: content/audio/node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-v1.0-q8
      - name: 合成剧集
        working-directory: content/audio
        run: node build_audio.mjs --accent ${{ matrix.accent }} --shard 0 --shards 1 --out out --dtype q8 --only e
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.accent }}-e
          path: content/audio/out
          retention-days: 3
          compression-level: 0
