# 剧集 + 雅思听力配音：content/episodes/*.json、content/ielts/listening.json 的台词 → Kokoro（每个角色自己的声音）→ mp3。
# 另配主角改名 / 男声的几套（content/episodes/names.json）。美音 / 英音 × 4 片并行，每片约 40 分钟
# 服务器用 ONLY=e scripts/sync-audio.sh <run_id> 发布到 sayday.ivyea.com/audio/{us,gb}/e/
# 只手动触发（全部重配）。加了台词 / 分支 / 支线：用 content-audio 的 incremental=true、only=e,v 只配新增的，ONLY=add 发布
name: content-episodes

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        accent: [us, gb]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: npm ci
        working-directory: content/audio
        run: npm ci --no-audit --no-fund
      - name: Kokoro 模型缓存
        uses: actions/cache@v4
        with:
          path: content/audio/node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-v1.0-q8
      - name: 合成剧集
        working-directory: content/audio
        run: node build_audio.mjs --accent ${{ matrix.accent }} --shard ${{ matrix.shard }} --shards 4 --out out --dtype q8 --only e,v
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.accent }}-e-${{ matrix.shard }}
          path: content/audio/out
          retention-days: 3
          compression-level: 0
