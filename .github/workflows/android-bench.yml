# 安卓原生推理验证包：只出 debug APK 挂在 workflow artifact 上，不发版。
# 本机不装 NDK/不编 APK（磁盘吃紧，曾把盘写满导致生产库宕机），安卓构建一律走这里。
name: android-bench

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/android**'

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 模型不入库：CI 从 Hugging Face 下载原始权重现导出 int8 ONNX；导出脚本不变就复用缓存
      - name: 模型缓存
        id: model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: phone-ctc-${{ hashFiles('spikes/m0/export_onnx.py') }}-v1

      - name: 导出 int8 音素模型
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "numpy<2.1" transformers==4.46.3 onnx onnxruntime==1.19.2
          mkdir -p .cache/models
          HF=https://huggingface.co
          curl -sSfL -o .cache/models/charsiu_ctc.bin     $HF/charsiu/en_w2v2_ctc_libris_and_cv/resolve/main/pytorch_model.bin
          curl -sSfL -o .cache/models/charsiu_config.json $HF/charsiu/en_w2v2_ctc_libris_and_cv/resolve/main/config.json
          curl -sSfL -o .cache/models/charsiu_vocab.json  $HF/charsiu/tokenizer_en_cmu/resolve/main/vocab.json
          python spikes/m0/export_onnx.py
          rm -f .cache/models/charsiu_ctc.bin .cache/models/phone_ctc.fp32.onnx
          ls -la .cache/models

      - name: 模型放进插件 assets
        run: |
          D=apps/native/src-tauri/plugins/sayday-infer/android/src/main/assets/models
          mkdir -p $D && cp .cache/models/phone_ctc.int8.onnx $D/
          ls -la $D

      - name: 组装前端
        run: scripts/build-native-web.sh

      - name: Rust（Android arm64）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 先 init 再生成图标：icon 命令发现 gen/android 时会顺带写安卓启动图标
      # 必须经 package.json 里的 CLI 调用：gradle 构建时会回调 `npm run tauri`，用 npx 临时跑会找不到 package.json
      - name: 初始化 Android 工程 + 图标
        working-directory: apps/native
        run: |
          npm ci --no-audit --no-fund
          npm run tauri -- android init
          cat ../../assets/brand/icon-1024.png > icon-src.png
          npm run tauri -- icon icon-src.png

      - name: 构建 debug APK（仅 arm64）
        working-directory: apps/native
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          unset NDK_HOME
          npm run tauri -- android build --apk --debug --target aarch64
          mkdir -p apk-out
          find src-tauri/gen/android -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out
          # 把实际解析出的 Cargo.lock 一并带出来，回填到仓库后构建就完全可复现
          cp src-tauri/Cargo.lock apk-out/Cargo.lock

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: sayday-android-bench
          path: |
            apps/native/apk-out/*.apk
            apps/native/apk-out/Cargo.lock
          retention-days: 14
