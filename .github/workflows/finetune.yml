# 中国口音微调（docs/口音微调方案.md）：在 GitHub 免费机器上用 CPU 训练
#   bench：只跑几十步测速
#   train：限时训练，存检查点到 artifact；到时间没训完就自己再触发一次接着跑（带上本次 run id），训完自动触发 eval
#   eval：导出微调模型，和原模型在同一套校准 / 测试集上对比（spikes/ft/compare.py），结果写进运行摘要
#   part：A / B 半或 all（整个训练集）。交叉拟合：B 和 all 可以同时训；all 训完自动跑 xeval（spikes/ft/xfit.py）
#   xeval：A 半用 ftB 的特征、B 半用 ft（A 半模型）的特征一起校准，给全训练集模型 ftall 用，和线上 ft1 对比
name: finetune

on:
  push:
    branches: ['feat/finetune**']
    paths: ['spikes/ft/**', '.github/workflows/finetune.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [bench, train, eval, xeval]
        default: bench
      part:
        type: choice
        options: [A, B, all]
        default: A
      base:
        description: 起步模型：charsiu，或授权明确的 xlsr-53 espeak（Apache-2.0，大 3 倍）
        type: choice
        options: [charsiu, xlsr]
        default: charsiu
      resume_run:
        description: 接着哪次 run 的检查点跑（留空 = 从头）
        default: ''
      epochs:
        default: '10'

permissions:
  contents: read
  actions: write

# 同一个 part 的训练排队接力；B 和 all 可以并行
concurrency:
  group: finetune-${{ inputs.base || 'charsiu' }}-${{ inputs.mode || 'bench' }}-${{ inputs.part || 'A' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MODE: ${{ inputs.mode || 'bench' }}
      PART: ${{ inputs.part || 'A' }}
      BASE: ${{ inputs.base || 'charsiu' }}
      # 检查点名：charsiu 的 A 半沿用 ft-ckpt；xlsr 起步的加 x
      CKPT: ${{ format('{0}{1}', inputs.base == 'xlsr' && 'ftx-ckpt' || 'ft-ckpt', (inputs.part == 'B' && '-B') || (inputs.part == 'all' && '-all') || '') }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依赖
        run: |
          python -m pip install --quiet torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "numpy<2.1" transformers==4.46.3 pyarrow soundfile onnx onnxruntime==1.19.2 scipy scikit-learn
          nproc; free -g; df -h .

      - name: 数据缓存
        uses: actions/cache@v4
        with:
          path: .cache/data
          key: so762-v1

      - name: 下载模型和数据
        run: |
          mkdir -p .cache/models .cache/data
          HF=https://huggingface.co
          curl -sSfL -o .cache/models/charsiu_ctc.bin     $HF/charsiu/en_w2v2_ctc_libris_and_cv/resolve/main/pytorch_model.bin
          curl -sSfL -o .cache/models/charsiu_config.json $HF/charsiu/en_w2v2_ctc_libris_and_cv/resolve/main/config.json
          curl -sSfL -o .cache/models/charsiu_vocab.json  $HF/charsiu/tokenizer_en_cmu/resolve/main/vocab.json
          for s in train test; do
            [ -s .cache/data/so762_$s.parquet ] || curl -sSfL -o .cache/data/so762_$s.parquet $HF/datasets/mispeech/speechocean762/resolve/main/data/$s-00000-of-00001.parquet
          done
          ls -la .cache/models .cache/data

      - name: 测速
        if: env.MODE == 'bench'
        run: python spikes/ft/train.py --base $BASE --bench 20 --threads $(nproc) $([ "$BASE" = xlsr ] && echo --batch-seconds 24)

      - name: 取上次的检查点
        if: (env.MODE == 'train' || env.MODE == 'eval' || env.MODE == 'xeval') && inputs.resume_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CKPT }}
          path: .cache/ft
          run-id: ${{ inputs.resume_run }}
          github-token: ${{ github.token }}

      - name: 训练
        if: env.MODE == 'train'
        run: |
          R=""; [ -s .cache/ft/ckpt.pt ] && R="--resume .cache/ft/ckpt.pt"
          B=""; [ "$BASE" = xlsr ] && B="--batch-seconds 24"
          python spikes/ft/train.py --base $BASE --part $PART --minutes 320 --threads $(nproc) --epochs ${{ inputs.epochs }} $B $R
          cat .cache/ft/state.json

      - name: 存检查点
        if: env.MODE == 'train'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CKPT }}
          path: |
            .cache/ft/ckpt.pt
            .cache/ft/state.json
            .cache/ft/log.jsonl
          retention-days: 14
          compression-level: 0

      - name: 没训完就接着跑
        if: env.MODE == 'train'
        run: |
          R="-R ${{ github.repository }} --ref ${{ github.ref_name }}"
          if python -c "import json,sys; sys.exit(0 if json.load(open('.cache/ft/state.json'))['done'] else 1)"; then
            # A 训完：和原模型对比；all 训完：交叉拟合评测（要用到已经训完的 B）；B 训完什么都不用做
            [ "$PART" = A ] && gh workflow run finetune.yml $R -f mode=eval -f base=$BASE -f resume_run=${{ github.run_id }}
            [ "$PART" = all ] && [ "$BASE" = charsiu ] && gh workflow run finetune.yml $R -f mode=xeval -f part=all -f resume_run=${{ github.run_id }}
            true
          else
            gh workflow run finetune.yml $R -f mode=train -f base=$BASE -f part=$PART -f resume_run=${{ github.run_id }} -f epochs=${{ inputs.epochs }}
          fi

      - name: 评测
        if: env.MODE == 'eval' && env.BASE == 'charsiu'
        run: |
          python spikes/m0/export_onnx.py
          python spikes/m0/export_onnx.py --ckpt .cache/ft/ckpt.pt --name ft_
          python spikes/ft/compare.py prep
          for m in int8 ft_int8; do
            for sp in test trainB; do
              python spikes/m0/infer_so762.py --model $m --split $sp --threads 4 | tail -2
              python spikes/m0/score_eval.py --logits $m --split $sp > /dev/null
            done
          done
          python spikes/ft/compare.py report int8 ft_int8 | tee -a $GITHUB_STEP_SUMMARY
          tail -3 .cache/ft/log.jsonl >> $GITHUB_STEP_SUMMARY

      - name: 存微调模型
        if: env.MODE == 'eval' && env.BASE == 'charsiu'
        uses: actions/upload-artifact@v4
        with:
          name: ft-model
          path: |
            .cache/models/phone_ctc.ft_int8.onnx
            .cache/ft/compare.json
            .cache/ft/log.jsonl
          retention-days: 30

      # 换模型时重算 App 的校准表（calib.json）要用：微调模型在 B 半 / 测试集上的输出和特征
      - name: 存微调模型的评测输出
        if: env.MODE == 'eval' && env.BASE == 'charsiu'
        uses: actions/upload-artifact@v4
        with:
          name: ft-feats
          # .cache 是隐藏目录：通配符匹配到的文件默认会被跳过
          include-hidden-files: true
          path: |
            .cache/logits_*ft_int8.npz
            .cache/feats_*ft_int8.npz
          retention-days: 30

      # ---------- 交叉拟合评测 ----------
      - name: 取 B 半模型和线上 ft1
        if: env.MODE == 'xeval'
        run: |
          B_RUN=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ft-ckpt-B&per_page=30" -q '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id')
          echo "B 半检查点来自 run $B_RUN"
          gh run download "$B_RUN" -R ${{ github.repository }} -n ft-ckpt-B -D .cache/ftB
          python -c "import json,sys; d=json.load(open('.cache/ftB/state.json')); sys.exit(0 if d['done'] else 'B 半还没训完')"
          curl -sSfL --retry 3 -o .cache/models/phone_ctc.ft_int8.onnx https://github.com/Hector-xue/sayday/releases/download/model-phone-ft1/phone_ctc.ft1.int8.onnx
          echo "354570df4f54a6cba3108166db6447d6eb19bdb9e056b4125c96d762b27e4a39  .cache/models/phone_ctc.ft_int8.onnx" | sha256sum -c -

      - name: 交叉拟合评测
        if: env.MODE == 'xeval'
        run: |
          python spikes/m0/export_onnx.py --ckpt .cache/ft/ckpt.pt --name ftall_
          python spikes/m0/export_onnx.py --ckpt .cache/ftB/ckpt.pt --name ftB_
          python spikes/ft/compare.py prep
          for job in "ftB_int8 trainA" "ft_int8 trainB" "ft_int8 test" "ftall_int8 test"; do
            set -- $job
            python spikes/m0/infer_so762.py --model $1 --split $2 --threads 4 | tail -1
            python spikes/m0/score_eval.py --logits $1 --split $2 > /dev/null
          done
          python spikes/ft/xfit.py | tee -a $GITHUB_STEP_SUMMARY
          tail -3 .cache/ft/log.jsonl >> $GITHUB_STEP_SUMMARY

      - name: 存全训练集模型和候选校准表
        if: env.MODE == 'xeval'
        uses: actions/upload-artifact@v4
        with:
          name: ft-all-model
          include-hidden-files: true
          path: |
            .cache/models/phone_ctc.ftall_int8.onnx
            .cache/ft/xfit.json
            .cache/ft/calib.xfit.json
            .cache/ft/log.jsonl
          retention-days: 30

      # ---------- xlsr 起步的微调：和线上 ft1、未微调的 xlsr 三方对比 ----------
      - name: 评测（xlsr）
        if: env.MODE == 'eval' && env.BASE == 'xlsr'
        run: |
          curl -sSfL --retry 3 -o .cache/models/phone_ctc.ft_int8.onnx https://github.com/Hector-xue/sayday/releases/download/model-phone-ft1/phone_ctc.ft1.int8.onnx
          echo "354570df4f54a6cba3108166db6447d6eb19bdb9e056b4125c96d762b27e4a39  .cache/models/phone_ctc.ft_int8.onnx" | sha256sum -c -
          python spikes/alt/export_xlsr.py
          python spikes/m0/export_onnx.py --ckpt .cache/ft/ckpt.pt --name ftx_
          rm -f .cache/models/*fp32.onnx
          python spikes/ft/compare.py prep
          for m in ft_int8 xlsr_int8 ftx_int8; do
            for sp in test trainB; do
              python spikes/m0/infer_so762.py --model $m --split $sp --threads 4 | tail -1
              python spikes/m0/score_eval.py --logits $m --split $sp > /dev/null
            done
          done
          python spikes/ft/compare.py report ft_int8 xlsr_int8 ftx_int8 | tee -a $GITHUB_STEP_SUMMARY
          for m in ft_int8 ftx_int8; do python -c "import json,sys; d=json.load(open('.cache/latency_'+sys.argv[1]+'.json')); print('-', sys.argv[1], '推理 p50', d.get('infer_p50_ms'), 'ms')" $m | tee -a $GITHUB_STEP_SUMMARY; done
          tail -3 .cache/ft/log.jsonl >> $GITHUB_STEP_SUMMARY

      - name: 存 xlsr 微调模型
        if: env.MODE == 'eval' && env.BASE == 'xlsr'
        uses: actions/upload-artifact@v4
        with:
          name: ftx-model
          include-hidden-files: true
          path: |
            .cache/models/phone_ctc.ftx_int8.onnx
            .cache/ft/compare.json
            .cache/ft/log.jsonl
            .cache/logits_*ftx_int8.npz
            .cache/feats_*ftx_int8.npz
          retention-days: 30
