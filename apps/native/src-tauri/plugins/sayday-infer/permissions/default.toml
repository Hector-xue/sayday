"$schema" = "schemas/schema.json"

[default]
description = "允许载入、下载音素模型（查进度）、推理、录音（含音量）、朗读、导出备份、更新桌面小组件、应用内更新、存收款码到相册、打开外部链接、添加桌面小组件、打开通知设置、通知里做题、面对面同步时列出本机局域网地址，以及听学的后台播放（开始、控制、状态、取走听过的词）。"
permissions = ["allow-load-model", "allow-model-status", "allow-model-fetch", "allow-run", "allow-record-start", "allow-record-level", "allow-record-stop", "allow-insets", "allow-set-bars", "allow-speak", "allow-speak-stop", "allow-save-to-downloads", "allow-update-widget", "allow-update-start", "allow-update-status", "allow-update-install", "allow-save-image", "allow-open-url", "allow-system-status", "allow-pin-widget", "allow-open-notify-settings", "allow-quiz-set", "allow-quiz-drain", "allow-quiz-test", "allow-take-action", "allow-lan-addrs", "allow-listen-start", "allow-listen-control", "allow-listen-state", "allow-listen-drain"]
