<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日日说</title>
<style>
  :root {
    --bg: #faf8f4; --surface: #ffffff; --ink: #1d1c1a; --muted: #77736b; --line: #e7e2d8;
    --accent: #2f4fa8; --good: #2e8b57; --warn: #c48a12; --bad: #c2412d;
    --good-bg: #e7f3ec; --warn-bg: #fbf1dc; --bad-bg: #f9e4e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --surface: #1f1f1c; --ink: #ecebe6; --muted: #9b978d; --line: #33322d;
      --accent: #8aa4ee; --good: #6cc495; --warn: #e2b54f; --bad: #ef7f6a;
      --good-bg: #1c3226; --warn-bg: #3a2f14; --bad-bg: #3d211b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 48px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .sub, .status { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 16px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .target { font: 500 21px/1.4 Georgia, serif; margin: 16px 0 4px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .rec { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 14px; flex: none; }
  .rec.on { background: var(--bad); }
  .rec:disabled, .btn:disabled { opacity: .4; }
  .btn { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px; padding: 8px 14px; white-space: nowrap; }
  .score { font: 600 40px/1 Georgia, serif; margin-top: 16px; }
  .words { display: flex; flex-wrap: wrap; gap: 12px 16px; margin-top: 12px; }
  .w { display: flex; flex-direction: column; gap: 4px; }
  .w b { font: 500 18px Georgia, serif; }
  .ps { display: flex; gap: 3px; }
  .p { font-size: 11px; padding: 1px 5px; border-radius: 5px; }
  .g { background: var(--good-bg); color: var(--good); }
  .y { background: var(--warn-bg); color: var(--warn); }
  .r { background: var(--bad-bg); color: var(--bad); }
  pre { font: 12px/1.7 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-all; margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <h1>日日说</h1>
  <p class="sub">M1 · 安卓原生推理验证 · 全部在本机计算</p>

  <section class="card">
    <h2>跟读测评</h2>
    <div class="chips" id="chips"></div>
    <div class="target" id="target"></div>
    <div class="row">
      <button class="rec" id="rec" disabled>录音</button>
      <span class="status" id="status">正在准备模型…</span>
    </div>
    <div id="result" hidden>
      <div class="score" id="score"></div>
      <div class="words" id="words"></div>
    </div>
  </section>

  <section class="card">
    <h2>设备测速</h2>
    <button class="btn" id="bench" disabled>开始测速（约 1 分钟）</button>
    <pre id="benchOut"></pre>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
